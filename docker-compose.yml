# Entorno completo local: Postgres + Redis + MinIO (S3) + API + worker + web.
#   cp apps/api/.env.example .env   (ajusta claves)   →   docker compose up --build
# Solo infraestructura (para desarrollar con npm run dev):  docker compose up postgres redis minio
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fruti, POSTGRES_PASSWORD: fruti, POSTGRES_DB: frutinovela }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fruti"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: fruti, MINIO_ROOT_PASSWORD: frutifruti }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 fruti frutifruti &&
             mc mb -p local/frutinovelas && mc anonymous set download local/frutinovelas"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: &svc_env
      DATABASE_URL: postgresql://fruti:fruti@postgres:5432/frutinovela
      DIRECT_URL: postgresql://fruti:fruti@postgres:5432/frutinovela
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: frutinovelas
      S3_ACCESS_KEY_ID: fruti
      S3_SECRET_ACCESS_KEY: frutifruti
      S3_PUBLIC_BASE_URL: http://localhost:9000/frutinovelas
      PUBLIC_API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started }, minio-init: { condition: service_completed_successfully } }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: *svc_env
    depends_on: [api]
    deploy: { replicas: 1 }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:4000 } }
    ports: ["3000:3000"]
    depends_on: [api]

volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
